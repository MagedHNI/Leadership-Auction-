<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Leadership Auction</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=IBM+Plex+Mono:wght@500;600&family=Manrope:wght@400;600;700;800&display=swap">
<style>
/* Layout: auction-house console. A projected "room" view (lot on the block, live bid, paddles, scoreboard) and a one-hand team tablet view. */
:root{
  --bg:#ECEEF3; --surface:#FFFFFF; --raise:#F6F7FA; --ink:#131929; --muted:#596178; --line:#D3D8E2;
  --brass:#9C6F14; --brass-ink:#FFFFFF; --brass-soft:#F4E8CD;
  --c:#2B66D3; --r:#138A63; --i:#C9620E; --s:#7445CC; --on-el:#FFFFFF;
  --c-soft:#E2EBFB; --r-soft:#DCF2E8; --i-soft:#FBEADB; --s-soft:#ECE3FA;
  --good:#138A63; --alert:#B9381A; --alert-soft:#FBE4DD;
  --f-display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-body:"Manrope", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-sm:6px; --r-md:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D111B; --surface:#161C2A; --raise:#1C2333; --ink:#E8EBF2; --muted:#98A1B4; --line:#2A3244;
  --brass:#DDAA4C; --brass-ink:#1A1304; --brass-soft:#352A12;
  --c:#74A1FF; --r:#48CB98; --i:#F4A257; --s:#AD90FF; --on-el:#0D111B;
  --c-soft:#182844; --r-soft:#123129; --i-soft:#372512; --s-soft:#261E44;
  --good:#48CB98; --alert:#FF8A6B; --alert-soft:#3A1C14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D111B; --surface:#161C2A; --raise:#1C2333; --ink:#E8EBF2; --muted:#98A1B4; --line:#2A3244;
  --brass:#DDAA4C; --brass-ink:#1A1304; --brass-soft:#352A12;
  --c:#74A1FF; --r:#48CB98; --i:#F4A257; --s:#AD90FF; --on-el:#0D111B;
  --c-soft:#182844; --r-soft:#123129; --i-soft:#372512; --s-soft:#261E44;
  --good:#48CB98; --alert:#FF8A6B; --alert-soft:#3A1C14; color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.num{font-variant-numeric:tabular-nums lining-nums}
.mono{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r-sm);padding:.6em 1em;font-weight:700;min-height:44px;transition:transform .08s ease, background .15s}
.btn:hover{background:var(--raise)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--alert);border-color:color-mix(in srgb, var(--alert) 45%, var(--line))}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.big{font-size:1.15rem;padding:.75em 1.4em;min-height:56px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}

/* ---------- start screen ---------- */
.start{max-width:880px;margin:0 auto;padding-block:clamp(24px,6vh,72px);display:grid;gap:28px}
.start h1{font-size:clamp(2.4rem,6vw,4.2rem)}
.start .lede{font-size:1.1rem;max-width:60ch;color:var(--muted)}
.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.paddle{display:grid;gap:6px;justify-items:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:16px;min-height:96px}
.paddle:hover{border-color:var(--brass)}
.paddle .pno{font-family:var(--f-display);font-size:2rem;line-height:1;color:var(--brass)}
.paddle b{font-size:1.05rem}
.host-pick{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed var(--line);border-radius:var(--r-md);padding:16px}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:14px 16px;font-size:.95rem}
.notice.warn{border-color:color-mix(in srgb, var(--alert) 40%, var(--line));background:var(--alert-soft)}

/* ---------- host shell ---------- */
.host{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding-block:14px}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:30px;height:30px;color:var(--brass);flex:none}
.brand h1{font-size:1.45rem}
.brand .mono{color:var(--muted)}
.phases{display:flex;flex-wrap:wrap;gap:4px}
.phases button{border:1px solid transparent;background:none;border-radius:999px;padding:.35em .85em;font-weight:600;font-size:.9rem;color:var(--muted)}
.phases button[aria-current="step"]{background:var(--ink);color:var(--bg)}
.phases button:hover:not([aria-current="step"]){border-color:var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:.25em .75em;font-size:.8rem;font-weight:700;background:var(--surface)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.pill.off i{background:var(--alert)}
.stage{min-width:0}

/* ---------- lot card ---------- */
.lot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;display:grid;grid-template-rows:auto 1fr;min-width:0}
.lot .band{background:var(--el);color:var(--on-el);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px}
.lot .band b{font-weight:800;letter-spacing:.02em}
.lot .face{padding:clamp(18px,3vw,40px);display:grid;align-content:center;gap:18px}
.lot .text{font-family:var(--f-display);font-weight:500;font-size:clamp(1.7rem,3.6vw,3.4rem);line-height:1.12;text-wrap:balance}
.lot .gloss{color:var(--muted)}
.el-c{--el:var(--c);--el-soft:var(--c-soft)} .el-r{--el:var(--r);--el-soft:var(--r-soft)}
.el-i{--el:var(--i);--el-soft:var(--i-soft)} .el-s{--el:var(--s);--el-soft:var(--s-soft)}

/* ---------- auction block ---------- */
.block{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:stretch}
.bidpanel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:clamp(16px,2.4vw,28px);display:grid;gap:16px;align-content:start;min-width:0}
.bignum{font-family:var(--f-display);font-weight:700;font-size:clamp(3.6rem,8vw,7.5rem);line-height:.95}
.bignum small{font-family:var(--f-body);font-size:.22em;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-left:.3em}
.leader{font-size:clamp(1.2rem,2vw,1.7rem);font-weight:800}
.callout{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:clamp(1.4rem,2.6vw,2.2rem);color:var(--alert);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.timer{display:grid;gap:6px}
.timer .track{height:8px;border-radius:99px;background:var(--raise);overflow:hidden;border:1px solid var(--line)}
.timer .fill{height:100%;background:var(--brass);width:100%;transition:width .25s linear}
.timer.over .fill{background:var(--alert)}
.paddles{display:grid;gap:6px}
.paddles .p{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:var(--r-sm);background:var(--raise)}
.paddles .p.top{background:var(--brass-soft);font-weight:800}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.backup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.backup .btn{min-height:36px;padding:.35em .7em;font-size:.85rem}

.soldcard{display:grid;gap:18px;justify-items:center;text-align:center;padding:clamp(20px,5vh,56px) 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.stamp{font-family:var(--f-display);font-weight:700;font-size:clamp(3rem,9vw,7rem);line-height:1;color:var(--brass);transform:rotate(-4deg);border:4px solid currentColor;padding:.05em .35em;border-radius:8px;animation:thump .45s cubic-bezier(.2,1.6,.4,1)}
.stamp.none{color:var(--muted)}
@keyframes thump{from{transform:rotate(-4deg) scale(1.6);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
.soldcard .what{font-family:var(--f-display);font-size:clamp(1.3rem,2.6vw,2.1rem);max-width:30ch;text-wrap:balance}

/* ---------- scoreboard ---------- */
.score{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.team{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;display:grid;gap:6px;min-width:0}
.team.lead{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass) inset}
.team .tn{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .coins{font-family:var(--f-display);font-weight:700;font-size:1.9rem;line-height:1}
.pips{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.pip{min-width:24px;height:24px;border-radius:5px;border:2px solid var(--el);display:grid;place-items:center;font-size:.75rem;font-weight:800;color:var(--el)}
.pip.on{background:var(--el);color:var(--on-el)}
.bonus{font-size:.72rem;font-weight:800;background:var(--brass);color:var(--brass-ink);border-radius:4px;padding:2px 6px;white-space:nowrap}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:clamp(16px,2.2vw,26px);display:grid;gap:14px;align-content:start;min-width:0}
.panel h2{font-size:clamp(1.5rem,2.6vw,2.3rem)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.hero-title{font-size:clamp(2.2rem,5vw,4.4rem)}

.equation{display:flex;flex-wrap:wrap;align-items:center;gap:.3em .5em;font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,4vw,3.4rem);line-height:1.1}
.equation .frac{display:inline-grid;text-align:center}
.equation .frac span:first-child{border-bottom:3px solid var(--ink);padding:0 .2em .05em}
.equation .frac span:last-child{padding-top:.05em}
.eqc{color:var(--c)} .eqr{color:var(--r)} .eqi{color:var(--i)} .eqs{color:var(--s)}
.elements{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.eltile{border-radius:var(--r-md);background:var(--el-soft);padding:14px;display:grid;gap:6px;align-content:start}
.eltile b{color:var(--el);font-size:1.05rem}
.source{font-size:.85rem;color:var(--muted)}
.rules{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rules li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline}
.rules li .k{font-family:var(--f-display);font-weight:700;font-size:1.5rem;color:var(--brass);min-width:3.2ch}

.catalogue{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{display:grid;gap:8px;align-content:start}
.col h3{font-family:var(--f-body);font-size:.95rem;font-weight:800;color:var(--el);display:flex;justify-content:space-between}
.mini{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--el);border-radius:var(--r-sm);padding:8px 10px;display:grid;gap:2px;font-size:.92rem;line-height:1.35}
.mini .mono{font-size:.68rem;color:var(--muted)}
.mini.sold{opacity:.5}
.mini.unc{border-style:dashed}
.mini .who{font-size:.75rem;font-weight:800;color:var(--muted)}
button.mini{text-align:left;width:100%}
button.mini:hover:not(:disabled){border-color:var(--brass);border-left-color:var(--el)}

.bars{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:9.5em minmax(0,1fr) 5.5em;gap:10px;align-items:center}
.bar-row .lbl{font-weight:800;color:var(--el)}
.bar-row .trk{height:26px;background:var(--raise);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar-row .fil{height:100%;background:var(--el);border-radius:4px 0 0 4px;transition:width .6s ease}
.bar-row .val{text-align:right;font-weight:800}
.question{font-family:var(--f-display);font-size:clamp(1.15rem,2vw,1.6rem);line-height:1.25}

.holdings{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.holding{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;display:grid;gap:6px;align-content:start;min-width:0}
.holding .mini{font-size:.82rem}

.tally{display:grid;gap:8px}
.tally .t{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.tally .t .trk{grid-column:1/-1;height:10px;background:var(--raise);border-radius:5px;overflow:hidden}
.tally .t .fil{height:100%;background:var(--el);transition:width .5s ease}
.tally .t .txt{font-size:.95rem;line-height:1.3}
.dots{font-weight:800}

.top5{display:grid;gap:12px;counter-reset:rank}
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:10px solid var(--el);border-radius:var(--r-md);padding:14px 18px;animation:rise .5s ease both}
.top .rank{font-family:var(--f-display);font-weight:700;font-size:2.6rem;line-height:1;color:var(--brass);min-width:1.4ch}
.top .t{font-family:var(--f-display);font-size:clamp(1.2rem,2.4vw,2rem);line-height:1.15}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.field{display:grid;gap:4px;font-size:.85rem;font-weight:700;color:var(--muted)}
.field input{font:inherit;font-weight:600;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:var(--r-sm);padding:.5em .6em;min-height:42px;width:100%}
.joined{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.jt{border:1px solid var(--line);border-radius:var(--r-md);padding:12px;background:var(--surface);display:grid;gap:4px}
.jt .state{font-size:.85rem;font-weight:800;color:var(--muted)}
.jt.on{border-color:var(--good)}
.jt.on .state{color:var(--good)}

.confirm{border:1px solid var(--alert);background:var(--alert-soft);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.drawer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;display:grid;gap:12px}

/* ---------- tablet ---------- */
.tab{max-width:760px;margin:0 auto;padding-block:14px 28px;display:grid;gap:14px}
.tabhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.tabhead .tn{font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1.1}
.tabhead .coins{font-family:var(--f-display);font-weight:700;font-size:2rem;line-height:1}
.status{border-radius:var(--r-md);padding:14px 16px;font-weight:800;font-size:1.15rem;text-align:center}
.status.lead{background:var(--brass-soft);color:var(--brass)}
.status.out{background:var(--alert-soft);color:var(--alert)}
.status.idle{background:var(--raise);color:var(--muted)}
.bidbtns{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.bidbtns .btn{min-height:84px;font-size:1.25rem;flex-direction:column;gap:2px}
.bidbtns .btn small{font-size:.75rem;font-weight:700;opacity:.85}
.tab .lot .text{font-size:clamp(1.5rem,5vw,2.3rem)}
.planrow{display:grid;grid-template-columns:auto minmax(0,1fr) 6.5em;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--el);border-radius:var(--r-sm);padding:8px 10px}
.planrow input[type=number]{font:inherit;font-weight:700;width:100%;background:var(--raise);border:1px solid var(--line);border-radius:var(--r-sm);padding:.4em .5em;color:var(--ink);min-height:40px}
.chk{width:30px;height:30px;border-radius:6px;border:2px solid var(--el);background:transparent;display:grid;place-items:center;font-weight:800;color:var(--on-el)}
.chk[aria-pressed="true"]{background:var(--el)}
.votecard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--el);border-radius:var(--r-sm);padding:12px;min-height:56px}
.votecard[aria-pressed="true"]{border-color:var(--brass);border-left-color:var(--el);box-shadow:0 0 0 2px var(--brass) inset}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--brass)}
.votecard[aria-pressed="true"] .dot{background:var(--brass)}
.foot{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}

/* ---------- trust scoring ---------- */
.wts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wt{display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:2px 8px;font-weight:800;font-size:.85rem;background:var(--raise);color:var(--muted);border:1px solid var(--line)}
.wt.on{background:var(--el-soft);color:var(--el);border-color:transparent}
.wt.pts{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wt-c{--el:var(--c);--el-soft:var(--c-soft)} .wt-r{--el:var(--r);--el-soft:var(--r-soft)} .wt-i{--el:var(--i);--el-soft:var(--i-soft)} .wt-s{--el:var(--s);--el-soft:var(--s-soft)}
.why{font-size:.92rem;color:var(--muted);max-width:62ch}
.mini .wts{margin-top:2px}
.mini .wt{font-size:.7rem;padding:1px 5px}
.trust{font-family:var(--f-display);font-weight:700;line-height:1}
.team .trustline{display:flex;justify-content:space-between;gap:8px;align-items:baseline;border-top:1px solid var(--line);padding-top:6px;font-size:.82rem;color:var(--muted)}
.team .trustline .trust{font-size:1.25rem;color:var(--ink)}
.delta{border:1px dashed var(--brass);border-radius:var(--r-sm);padding:8px 12px;text-align:center;font-weight:700}
.delta .trust{font-size:1.3rem;color:var(--brass)}
.method{display:grid;gap:10px;margin:0;padding-left:1.2em}
.method li{padding-left:.2em}
.formula{font-family:var(--f-mono);font-size:.9rem;background:var(--raise);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;overflow-x:auto;white-space:nowrap}
.caveat{border-left:4px solid var(--brass);background:var(--brass-soft);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:10px 14px;font-size:.92rem}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md)}
table.scores{border-collapse:collapse;width:100%;min-width:720px;font-size:.9rem}
table.scores th,table.scores td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.scores th{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--raise)}

.rank-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:var(--r-sm);background:var(--raise)}

.btn.start{background:var(--brass);border-color:var(--brass);color:var(--brass-ink);font-size:1.05rem;padding:.55em 1.2em;box-shadow:0 0 0 4px var(--brass-soft)}
.btn.start.huge{font-size:clamp(1.4rem,2.6vw,2rem);min-height:76px;padding:.5em 1.6em}

.conn{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border-radius:var(--r-md);padding:12px 16px;font-weight:600;border:2px solid var(--alert);background:var(--alert-soft);color:var(--ink)}
.conn b{color:var(--alert)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<div id="app"></div>

<script>
(() => {
"use strict";

/* ===================== content ===================== */
const EL = {
  c:{name:"Credibility", gloss:"We know what we're talking about"},
  r:{name:"Reliability", gloss:"We do what we say"},
  i:{name:"Intimacy", gloss:"People feel safe bringing things to us"},
  s:{name:"Low self-orientation", gloss:"We focus on the employee, not on ourselves"}
};
const CARDS = [
  ["c1","c","We know the business, not just the policy."],
  ["c2","c","Our advice is backed by data, not opinion."],
  ["c3","c","We give a clear answer, not “it depends.”"],
  ["c4","c","We bring a recommendation, not just a list of options."],
  ["c5","c","We keep our expertise current, from labour law to AI."],
  ["r1","r","We close every case on the date we promised."],
  ["r2","r","Employees hear from us before they have to chase us."],
  ["r3","r","The same question gets the same answer, whoever you ask in HR."],
  ["r4","r","If we are going to miss a deadline, we say so before it passes."],
  ["r5","r","Every request is acknowledged within one working day."],
  ["i1","i","We listen to understand before we quote the policy."],
  ["i2","i","Every case is a person, not a ticket."],
  ["i3","i","What you tell us in confidence stays in confidence."],
  ["i4","i","Employees can bring us bad news without fear."],
  ["i5","i","We ask “how are you?” and wait for the real answer."],
  ["s1","s","We say “let me find a way” before “that’s not possible.”"],
  ["s2","s","We measure success by the employee’s outcome, not our process."],
  ["s3","s","We change our process when it stops serving people."],
  ["s4","s","We give the credit to managers and employees, not to HR."],
  ["s5","s","We design every service from the employee’s side of the desk."]
].map(([id,el,text]) => ({id,el,text}));

/* ----- Trust scoring (HNI facilitation design, not a validated measure) -----
   Each card is rated 0-3 on the four elements of the Trust Equation:
   3 = the element the behaviour mainly builds (every card has exactly one),
   2 = a strong secondary effect, 1 = a clear secondary effect, 0 = no direct effect.
   For S the rating is how much the behaviour LOWERS self-orientation.
   Card trust points = C + R + I + S.
   Team trust score  = (sum C + sum R + sum I) / S_team,
   where S_team = max(S_FLOOR, S_START - sum S). */
const S_START = 10, S_FLOOR = 1;
const WEIGHTS = {
  c1:[3,0,0,1,"Knowing the business is the core of credibility. Looking past our own rulebook also lowers self-orientation."],
  c2:[3,1,0,0,"Evidence is what makes expert advice believable. It also makes advice repeatable: the same facts give the same answer."],
  c3:[3,0,0,1,"A clear answer shows command of the subject. Hedging protects HR, so dropping it also lowers self-orientation."],
  c4:[3,0,0,0,"Offering a judgement, not just options, is expertise in action. A pure credibility behaviour."],
  c5:[3,0,0,0,"Up-to-date knowledge is the base that credibility rests on."],
  r1:[0,3,0,0,"Keeping a dated promise is the definition of reliability."],
  r2:[0,3,0,1,"Proactive updates are dependable follow-through. Sparing the employee the chase also puts their time ahead of ours."],
  r3:[1,3,0,0,"Consistency across the team is reliability. It also signals shared expertise."],
  r4:[0,3,1,0,"Warning early protects the promise. Being candid about a slip also makes it safer to be open with us."],
  r5:[0,3,0,0,"A fixed response standard is a small promise kept every time."],
  i1:[0,0,3,2,"Listening first is the heart of intimacy. Putting the person before the policy lowers self-orientation strongly, so it scores 2 there."],
  i2:[0,0,3,1,"Treating the case as a person builds safety. It also moves attention from our process to them."],
  i3:[0,1,3,0,"Confidentiality is what makes people safe to speak. Keeping a confidence is also a kept promise."],
  i4:[0,0,3,0,"Being able to raise bad news without fear is intimacy in its purest form."],
  i5:[0,0,3,1,"Genuine interest builds closeness, and waiting for the answer keeps the focus on them, not on us."],
  s1:[0,0,1,3,"Looking for a way to help puts the employee's goal first. It also tells them we're on their side."],
  s2:[0,0,0,3,"Judging ourselves by the employee's outcome is the clearest shift away from self-orientation."],
  s3:[0,0,0,3,"Changing our own process for people's sake puts them ahead of our comfort."],
  s4:[0,0,0,3,"Giving the credit away removes our need to look good."],
  s5:[0,0,1,3,"Designing from the employee's side keeps attention on them. It also needs real understanding of their experience."]
};
CARDS.forEach(c => { const w = WEIGHTS[c.id]; c.w = {c:w[0], r:w[1], i:w[2], s:w[3]}; c.why = w[4]; c.pts = w[0]+w[1]+w[2]+w[3]; });
const CARD = Object.fromEntries(CARDS.map(c => [c.id,c]));
function trustOf(ids){
  const t = {c:0,r:0,i:0,s:0};
  ids.forEach(id => { const c = CARD[id]; if (c) { t.c+=c.w.c; t.r+=c.w.r; t.i+=c.w.i; t.s+=c.w.s; } });
  const N = t.c + t.r + t.i;
  const S = Math.max(S_FLOOR, S_START - t.s);
  return {c:t.c, r:t.r, i:t.i, sred:t.s, N, S, T: N / S, floored: S_START - t.s < S_FLOOR};
}
const fmtT = x => (Math.round(x*100)/100).toFixed(2);
// Lots alternate colours so every element comes up early
const ORDER = [];
for (let n=1;n<=5;n++) for (const e of ["c","r","i","s"]) ORDER.push(e+n);
const lotNo = id => String(ORDER.indexOf(id)+1).padStart(2,"0");
const TEAM_IDS = ["t1","t2","t3","t4","t5"];
const DEFAULTS = {budget:1000, opening:50, step:50, bonus:100, lotSeconds:60, strategyMin:5,
  teams:["Wisdom","Collaboration","Innovation","Sustainability","Humanity"]};
const PHASES = [["join","Join"],["rules","Rules"],["strategy","Strategy"],["auction","Auction"],["debrief","Debrief"],["vote","Dot vote"],["top5","Top 5"]];

function freshState(settings, prev){
  return {phase:"join", phaseAt:Date.now(), round: prev ? (prev.round||0) : 0, roundNo:0, cardId:null, openedAt:0,
    call:0, callHigh:0, sold:{}, unclaimed:[], lastSale:null,
    voteRound: prev ? (prev.voteRound||1)+1 : 1, pitchAt:0,
    settings: JSON.parse(JSON.stringify(settings || DEFAULTS))};
}

/* ===================== helpers ===================== */
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const fmt = n => Number(n||0).toLocaleString("en-US");
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { v===null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} };

/* ===================== store (shared live db; practice only by explicit choice) ===================== */
// mode: "connecting" | "live" | "offline" (no shared db: warn, never fall back silently) | "practice" (facilitator chose one screen)
const store = {mode:"connecting", state:null, gotState:false, bids:{}, votes:{}, canWrite:true, error:"",
  link:"ok", stalled:false, writeFail:false, netOnline: navigator.onLine !== false,
  room:null, roomUp:false, peers:{}};
let db = null;
const queues = {};

function S(){ return store.state || freshState(DEFAULTS); }
function teamName(t){ const st=S(); return (st.settings.teams||DEFAULTS.teams)[TEAM_IDS.indexOf(t)] || t; }
function canSync(){ return store.mode==="live" || store.mode==="practice"; }

function applyLocal(path, data){
  const [col,id] = path.split("/");
  if (col==="game") { store.state = data; store.gotState = true; }
  else if (col==="bids") { if (data===null) delete store.bids[id]; else store.bids[id]=data; }
  else if (col==="votes") { if (data===null) delete store.votes[id]; else store.votes[id]=data; }
}
function write(path, data){
  if (!canSync()) {
    store.error = "Not connected to the live game, so nothing was sent. See the connection warning above.";
    scheduleRender(); return false;
  }
  applyLocal(path, data);
  scheduleRender();
  if (store.mode!=="live") return true;
  const q = queues[path] || (queues[path] = {busy:false, has:false, next:null});
  q.next = data; q.has = true;
  if (!q.busy) flush(path);
  return true;
}
async function flush(path){
  const q = queues[path]; q.busy = true;
  while (q.has) {
    const d = q.next; q.has = false;
    for (let attempt=0; attempt<2; attempt++) {
      try {
        const ref = db.doc(path); if (d===null) await ref.delete(); else await ref.set(d);
        if (store.writeFail) { store.writeFail = false; scheduleRender(); }
        break;
      } catch(e) {
        if (e && e.code==="unavailable" && attempt===0) { await sleep(300+Math.random()*700); continue; }
        if (e && e.code==="invalid_argument") { store.canWrite=false; }
        store.writeFail = true;
        store.error = (e && e.code==="invalid_argument")
          ? "This screen can see the game but can't send to it. Sign in to claude.ai with an account that can edit this page."
          : "A change didn't reach the other screens (" + ((e && e.code) || "error") + "). Check the Wi-Fi and tap again.";
        // put this screen back in step with what the other screens see
        try { const snap = await db.doc(path).get(); applyLocal(path, snap.exists ? snap.data() : null); } catch(_) {}
        scheduleRender(); break;
      }
    }
  }
  q.busy = false;
}

/* What's wrong with the link, in the room's words. null = all good. */
function connIssue(){
  if (store.mode==="connecting") return null;
  if (store.mode==="offline") return {hard:true, title:"Not connected to the live game.",
    text:"Tablets and the projector can't see each other, so bids won't sync. Open this page from claude.ai while signed in, on every device, then reload."};
  if (store.mode==="practice") return {hard:false, title:"Practice mode: this screen only.",
    text:"Nothing here reaches the tablets. Reload the page to connect to the live game."};
  if (!store.netOnline) return {hard:true, title:"This device is offline.", text:"Reconnect to Wi-Fi. Bids made now won't reach the other screens."};
  if (store.link==="lost") return {hard:true, title:"Live connection lost.", text:"Reload this page to rejoin the game. Your coins and cards are safe on the server."};
  if (store.stalled) return {hard:true, title:"Can't reach the live game.", text:"No reply from the server yet. Check the Wi-Fi, then reload."};
  if (store.writeFail) return {hard:false, title:"Last change didn't sync.", text:"Check the Wi-Fi and tap again."};
  if (store.link==="syncing") return {hard:false, title:"Reconnecting…", text:"Showing the last known game. It will catch up on its own."};
  return null;
}

/* who is connected right now (presence: display only, never authority) */
function setPresence(){
  if (!store.room || !ui.role) return;
  try { store.room.presence({role: ui.role}).catch(() => {}); } catch(e){}
}
function connectedTeams(){
  const set = {};
  Object.values(store.peers).forEach(p => { const r = p && p.presence && p.presence.role; if (r && TEAM_IDS.includes(r)) set[r] = (set[r]||0)+1; });
  return set;
}

async function init(){
  render();
  let user = null;
  try { db = (window.claude && window.claude.use) ? await window.claude.use("db") : null; } catch(e){ db = null; }
  if (!db) { store.mode = "offline"; render(); return; }
  try { user = await window.claude.use("user"); } catch(e){ user = null; }
  store.mode = "live";
  if (user) { try { const can = await user.can("data.write"); if (can===false) store.canWrite=false; } catch(e){} }
  const onErr = e => {
    store.link = "lost";
    store.error = (e && e.code==="revoked") ? "This page lost access to the live game. Reload it." : "";
    scheduleRender();
  };
  const seen = meta => { store.stalled = false; if (store.link!=="lost") store.link = meta && meta.fromCache ? "syncing" : "ok"; };
  setTimeout(() => { if (!store.gotState) { store.stalled = true; scheduleRender(); } }, 12000);
  db.doc("game/state").onSnapshot(s => { store.state = s.exists ? s.data() : null; store.gotState = true; seen(s.metadata); scheduleRender(); }, onErr);
  db.collection("bids").onSnapshot(q => { const o={}; q.docs.forEach(d => { o[d.id]=d.data(); }); store.bids=o; seen(q.metadata); scheduleRender(); }, onErr);
  db.collection("votes").onSnapshot(q => { const o={}; q.docs.forEach(d => { o[d.id]=d.data(); }); store.votes=o; scheduleRender(); }, onErr);
  render();
  // live "who's connected" for the join screen and scoreboard
  try {
    const room = await window.claude.use("room");
    if (room) {
      store.room = room;
      room.onConnection(up => { store.roomUp = up; scheduleRender(); }, () => { store.roomUp = false; scheduleRender(); });
      room.onPeers(ch => { const m = {}; ch.peers.forEach(p => { if (!p.sameTab) m[p.peer] = p; }); store.peers = m; scheduleRender(); }, () => {});
      setPresence();
    }
  } catch(e){}
}
window.addEventListener("online", () => { store.netOnline = true; scheduleRender(); });
window.addEventListener("offline", () => { store.netOnline = false; scheduleRender(); });

/* ===================== game logic ===================== */
function leader(){
  const st = S(); let best = null;
  for (const t of TEAM_IDS) {
    const b = store.bids[t];
    if (!b || b.round!==st.round || !(b.amount>0)) continue;
    if (b.amount > left(t)) continue;
    if (!best || b.amount>best.amount || (b.amount===best.amount && (b.at||0)<best.at)) best = {team:t, amount:b.amount, at:b.at||0};
  }
  return best;
}
function roundBids(){
  const st = S();
  return TEAM_IDS.map(t => ({team:t, b:store.bids[t]})).filter(x => x.b && x.b.round===st.round && x.b.amount>0 && x.b.amount<=left(x.team))
    .sort((a,b) => b.b.amount-a.b.amount || (a.b.at||0)-(b.b.at||0));
}
function spent(t){ return Object.values(S().sold).filter(s => s.team===t).reduce((a,s) => a+s.price, 0); }
function left(t){ return (S().settings.budget||0) - spent(t); }
function owned(t){ return Object.entries(S().sold).filter(([,s]) => s.team===t).map(([id]) => CARD[id]).filter(Boolean); }
function colourCount(t){ const o={c:0,r:0,i:0,s:0}; owned(t).forEach(c => o[c.el]++); return o; }
function hasSet(t){ const o = colourCount(t); return o.c>0 && o.r>0 && o.i>0 && o.s>0; }
function teamTrust(t){ return trustOf(owned(t).map(c => c.id)); }
function trustIfWon(t, id){ return trustOf(owned(t).map(c => c.id).concat([id])); }
function roomTrust(){ const xs = TEAM_IDS.map(t => teamTrust(t).T); return xs.reduce((a,b) => a+b, 0) / xs.length; }
function started(){ return (S().roundNo||0) > 0; }
function nextRoundNo(){ return (S().roundNo||0) + 1; }
function nextLotId(){
  const st = S();
  return ORDER.find(id => !st.sold[id] && !st.unclaimed.includes(id) && !(st.phase==="bidding" && id===st.cardId)) || null;
}
function remainingLots(){ const st=S(); return ORDER.filter(id => !st.sold[id] && !st.unclaimed.includes(id)); }
function voteCandidates(){
  const sold = ORDER.filter(id => S().sold[id]);
  return sold.length >= 5 ? sold : ORDER.slice();
}
function voteTotals(){
  const st = S(); const tot = {}; let voters = 0;
  for (const t of TEAM_IDS) {
    const v = store.votes[t];
    if (!v || v.voteRound!==st.voteRound) continue;
    voters += v.voters||0;
    for (const [id,n] of Object.entries(v.counts||{})) tot[id] = (tot[id]||0)+n;
  }
  const list = voteCandidates().map(id => ({id, n: tot[id]||0})).sort((a,b) => b.n-a.n || ORDER.indexOf(a.id)-ORDER.indexOf(b.id));
  return {list, voters};
}

/* host actions */
function hostWrite(mut){ const st = clone(S()); mut(st); write("game/state", st); }
function setPhase(p){
  if (p==="auction") { auctionTab(); return; }
  hostWrite(st => { st.phase=p; st.phaseAt=Date.now(); st.pitchAt=0; });
}
function auctionTab(){
  const st = S();
  if (st.phase==="bidding" || st.phase==="sold") return;
  if (started()) hostWrite(s => { s.phase="sold"; s.phaseAt=Date.now(); });
  else hostWrite(s => { s.phase="ready"; s.phaseAt=Date.now(); });
}
function openLot(id){
  if (!id) { setPhase("debrief"); return; }
  hostWrite(st => {
    st.phase="bidding"; st.round=(st.round||0)+1; st.roundNo=(st.roundNo||0)+1; st.cardId=id; st.openedAt=Date.now(); st.phaseAt=Date.now();
    st.call=0; st.callHigh=0; st.unclaimed = st.unclaimed.filter(x => x!==id); st.lastSale=null;
  });
  ui.drawer=null;
}
function callOut(n){ const L=leader(); hostWrite(st => { st.call=n; st.callHigh = L ? L.amount : 0; }); }
function sell(){
  const L = leader(); const st0 = S(); if (!st0.cardId) return;
  if (!L) { noSale(); return; }
  hostWrite(st => { st.sold[st.cardId] = {team:L.team, price:L.amount}; st.lastSale={cardId:st.cardId, team:L.team, price:L.amount}; st.phase="sold"; st.phaseAt=Date.now(); st.call=0; });
  sound("gavel");
}
function noSale(){
  hostWrite(st => { if (!st.unclaimed.includes(st.cardId)) st.unclaimed.push(st.cardId); st.lastSale={cardId:st.cardId, team:null, price:0}; st.phase="sold"; st.phaseAt=Date.now(); st.call=0; });
  sound("thud");
}
function undoSale(){
  hostWrite(st => {
    const ls = st.lastSale; if (!ls) return;
    delete st.sold[ls.cardId]; st.unclaimed = st.unclaimed.filter(x => x!==ls.cardId);
    st.cardId = ls.cardId; st.lastSale=null; st.phase="bidding"; st.call=0; st.callHigh=0; st.phaseAt=Date.now();
  });
}
function placeBid(team, jump){
  const st = S(); if (st.phase!=="bidding") return;
  const L = leader(); const step = st.settings.step||50;
  if (L && L.team===team) return;
  const amount = L ? L.amount + jump : (st.settings.opening||50) + (jump-step);
  if (amount > left(team)) return;
  write("bids/"+team, {round:st.round, amount, at:Date.now(), joined:true});
}
function resetGame(){
  const prev = S();
  write("game/state", freshState(prev.settings, prev));
  for (const t of TEAM_IDS) {
    if (store.bids[t]) write("bids/"+t, {round:-1, amount:0, at:0, joined:!!store.bids[t].joined});
    if (store.votes[t]) write("votes/"+t, null);
  }
  ui.confirm=null; ui.drawer=null;
}

/* ===================== local UI state ===================== */
const ui = {
  role: lsGet("la-role"),   // "host" | "t1".."t5" | null
  drawer:null, confirm:null, hostAsk:false,
  sound: lsGet("la-sound")!=="off",
  vote: {sel:[], done:false},
  lastHigh:0, lastSaleKey:""
};
function plan(team){ try { return JSON.parse(lsGet("la-plan-"+team)||"{}") || {}; } catch(e){ return {}; } }
function savePlan(team,p){ lsSet("la-plan-"+team, JSON.stringify(p)); }

/* ===================== sound ===================== */
let actx = null;
function sound(kind){
  if (!ui.sound || ui.role!=="host") return;
  try {
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = "triangle";
    const f = kind==="gavel" ? 150 : kind==="thud" ? 90 : 660;
    o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f*0.5, t+0.18);
    g.gain.setValueAtTime(kind==="bid"?0.08:0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t+(kind==="bid"?0.12:0.35));
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.4);
    if (kind==="gavel") setTimeout(() => sound("thud"), 170);
  } catch(e){}
}

/* ===================== render ===================== */
let renderQueued = false, renderDeferred = false, lastViewKey = "";
function scheduleRender(){ if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued=false; render(); }); }
function typing(){ const a=document.activeElement; return a && $app.contains(a) && (a.tagName==="INPUT" || a.tagName==="TEXTAREA"); }
document.addEventListener("focusout", () => { if (renderDeferred) { renderDeferred=false; setTimeout(scheduleRender, 0); } });

function render(){
  // A new round or stage always reaches every screen, even mid-typing.
  const st0 = S();
  const viewKey = (ui.role||"-") + "|" + st0.phase + "|" + (st0.roundNo||0);
  const stageChanged = viewKey !== lastViewKey;
  if (typing() && !stageChanged) { renderDeferred = true; return; }
  if (stageChanged && typing()) document.activeElement.blur();
  // sound cues for the room
  const L = leader();
  if (ui.role==="host" && S().phase==="bidding" && L && L.amount>ui.lastHigh) sound("bid");
  ui.lastHigh = (S().phase==="bidding" && L) ? L.amount : 0;

  let html;
  if (store.mode==="connecting") html = `<div class="start"><p class="mono muted">Connecting to the auction room…</p></div>`;
  else if (!ui.role) html = startView();
  else if (ui.role==="host") html = hostView();
  else html = tabletView(ui.role);
  $app.innerHTML = html;
  if (stageChanged && lastViewKey && ui.role && ui.role!=="host") { try { window.scrollTo(0,0); } catch(e){} }
  lastViewKey = viewKey;
  tick();
}

function gavelSvg(){ return `<svg viewBox="0 0 32 32" aria-hidden="true" fill="currentColor"><rect x="4" y="5" width="15" height="8" rx="2" transform="rotate(-35 11.5 9)"/><rect x="13.5" y="11" width="3.2" height="17" rx="1.6" transform="rotate(-35 15 19.5)"/><rect x="3" y="26" width="16" height="3" rx="1.5"/></svg>`; }

function connBanner(){
  const c = connIssue(); if (!c) return "";
  return `<div class="conn ${c.hard?"":"soft"}" role="${c.hard?"alert":"status"}"><b>${esc(c.title)}</b><span>${esc(c.text)}</span></div>`;
}
function errorBar(){
  let out = connBanner();
  if (store.error) out += `<div class="notice warn" role="alert">${esc(store.error)} <button class="btn ghost" data-act="clear-error">Dismiss</button></div>`;
  if (store.mode==="live" && !store.canWrite) out += `<div class="notice warn">You can watch from this screen, but bids and controls need an account that can edit this page.</div>`;
  return out;
}
function liveTablets(){
  // A tablet counts as connected when it's in the room right now; "joined" alone means it joined at some point.
  const now = connectedTeams();
  return TEAM_IDS.map(t => ({team:t, now: !!now[t], joined: !!(store.bids[t] && store.bids[t].joined)}));
}
function tabletCount(){
  const lt = liveTablets();
  return store.room ? lt.filter(x => x.now).length : lt.filter(x => x.joined).length;
}

/* ---------- scoring pieces ---------- */
function weightChips(c, withPts){
  const k = [["c","C"],["r","R"],["i","I"],["s","S−"]];
  return `<span class="wts" aria-label="Trust ratings: credibility ${c.w.c}, reliability ${c.w.r}, intimacy ${c.w.i}, lowers self-orientation by ${c.w.s}">${k.map(([e,l]) => `<span class="wt wt-${e} ${c.w[e]?"on":""}">${l}${c.w[e]}</span>`).join("")}${withPts?`<span class="wt pts">${c.pts} pts</span>`:""}</span>`;
}
function methodHtml(compact){
  return `<ol class="method">
    <li>Each card is rated 0–3 on the four elements: <b>3</b> = the element it mainly builds (every card has exactly one), <b>2</b> = a strong secondary effect, <b>1</b> = a clear secondary effect, <b>0</b> = no direct effect. For self-orientation the rating is how much the behaviour <b>lowers</b> it.</li>
    <li><b>Card trust points</b> = C + R + I + S−. Cards range from 3 to 5 points.</li>
    <li><b>Team trust score</b> = (C + R + I) ÷ S. Every team starts with S = ${S_START}; each S− point lowers it by 1, down to a floor of ${S_FLOOR}. No cards = 0.</li>
    ${compact ? "" : `<li>Because S is the divisor, a purple card adds little on its own but raises the value of every other card you own. Buying only purple cards stops paying off once S reaches ${S_FLOOR}, because you still need something on top of the line.</li>
    <li><b>Room trust score</b> = the average of the five team scores.</li>`}
  </ol>
  <div class="formula">Trust = (C + R + I) ÷ S &nbsp;&nbsp;·&nbsp;&nbsp; S = max(${S_FLOOR}, ${S_START} − S−)</div>
  <div class="caveat">These ratings are HNI's facilitation design for this game, based on our reading of the four trust elements in Maister, Green &amp; Galford (2000). They are not a validated measure of trust. Use them to start the conversation, and challenge any rating you disagree with in the debrief.</div>`;
}
function scoringDrawer(){
  return `<section class="drawer"><div class="row"><b>How scoring works</b><span class="spacer"></span><button class="btn ghost" data-act="cancel">Close</button></div>
    <div class="grid2"><div style="display:grid;gap:12px">${methodHtml(false)}</div>
      <div style="display:grid;gap:10px;align-content:start"><p class="mono muted">Worked example</p>
        ${(() => { const ex = trustOf(["c1","r1","i1","s2"]); return `<p>A team owning Lots ${["c1","r1","i1","s2"].map(lotNo).join(", ")} has C ${ex.c} + R ${ex.r} + I ${ex.i} = ${ex.N} on top. S− totals ${ex.sred}, so S = ${S_START} − ${ex.sred} = ${ex.S}. Trust = ${ex.N} ÷ ${ex.S} = <b>${fmtT(ex.T)}</b>.</p>`; })()}
        ${(() => { const ex = trustOf(["c1","c2","r1","r3"]); return `<p>Swap the orange and purple cards for two more blue and green ones: ${ex.N} ÷ ${ex.S} = <b>${fmtT(ex.T)}</b>. Same total card points, lower trust, because S stays high.</p>`; })()}
      </div></div>
    <div class="tablewrap"><table class="scores"><thead><tr><th>Lot</th><th>Behaviour</th><th>C</th><th>R</th><th>I</th><th>S−</th><th>Pts</th><th>Why this rating</th></tr></thead><tbody>
      ${ORDER.map(id => { const c = CARD[id]; return `<tr class="el-${c.el}"><td class="num">${lotNo(id)}</td><td>${esc(c.text)}</td>${["c","r","i","s"].map(e => `<td class="n ${c.w[e]?"":"z"}">${c.w[e]}</td>`).join("")}<td class="n">${c.pts}</td><td class="why">${esc(c.why)}</td></tr>`; }).join("")}
    </tbody></table></div>
  </section>`;
}
function trustBreakdown(tt){ return `(${tt.c} + ${tt.r} + ${tt.i}) ÷ ${tt.S}`; }

    const c = CARD[ls.cardId];

function tabletPlan(t){

function tabletBid(t){
  const st = S(); const L = leader(); const step = st.settings.step; const myLeft = left(t);
  const p = plan(t)[st.cardId];
  const base = L ? L.amount : st.settings.opening - step;
  const jumps = [step, step*2, step*4];
  const leading = L && L.team===t;
  const callShown = st.call && (!L || L.amount <= st.callHigh);
  const blocked = store.mode==="live" && (!store.canWrite || (connIssue() && connIssue().hard));
  const now = teamTrust(t), ifWon = trustIfWon(t, st.cardId);
  let status;
  if (leading) status = `<div class="status lead">You're leading at <span class="num">${fmt(L.amount)}</span></div>`;
  else if (L) status = `<div class="status out">Team ${esc(teamName(L.team))} leads at <span class="num">${fmt(L.amount)}</span></div>`;
  else status = `<div class="status idle">No bids yet. Opening bid is <span class="num">${fmt(st.settings.opening)}</span></div>`;
  return `<div class="row" style="justify-content:space-between"><span class="roundtag">Round ${st.roundNo}</span><span class="muted">Lot ${lotNo(st.cardId)}</span></div>
    ${lotCard(st.cardId, p && p.want ? `<p class="mono" style="color:var(--brass)">On your list · your top price ${p.max?fmt(p.max):"not set"}</p>` : "")}
    <div class="delta">If you win this lot, your trust score goes from <span class="num">${fmtT(now.T)}</span> to <span class="trust num">${fmtT(ifWon.T)}</span></div>
    ${callShown ? `<div class="status out" style="font-size:1.4rem">${st.call===1?"Going once…":"Going twice…"}</div>` : ""}
    ${status}
    <div class="bidbtns">${jumps.map((j,i) => { const amt = base + j; const ok = !leading && amt<=myLeft && !blocked;
      return `<button class="btn ${i===0?"primary":""}" data-act="bid" data-jump="${j}" ${ok?"":"disabled"}><span class="num">Bid ${fmt(amt)}</span><small>${i===0?(L?`+${step}`:"opening bid"):`jump +${fmt(j)}`}</small></button>`; }).join("")}</div>
    ${blocked ? `<p class="muted" style="text-align:center">Bidding is paused on this tablet until the connection is back.</p>` : ""}
    ${!leading && base+step>myLeft ? `<p class="muted" style="text-align:center">Not enough coins to raise on this lot.</p>` : ""}`;
}

/* ===================== timers (display only) ===================== */
function tick(){
  const now = Date.now();
  document.querySelectorAll("[data-countdown]").forEach(el => {
    const ms = Number(el.dataset.countdown) - now; const s = Math.max(0, Math.ceil(ms/1000));
    el.textContent = Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
    el.style.color = ms<=0 ? "var(--alert)" : "";
  });
  document.querySelectorAll("[data-timer-end]").forEach(el => {
    const len = Number(el.dataset.timerLen); const ms = Number(el.dataset.timerEnd) - now;
    const f = el.querySelector(".fill"); if (f) f.style.width = Math.max(0, Math.min(100, ms/len*100)) + "%";
    el.classList.toggle("over", ms<=0);
  });
}
setInterval(tick, 250);

/* ===================== events ===================== */
$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act;
  const team = ui.role && ui.role!=="host" ? ui.role : null;
  switch (a) {
    case "pick": {
      ui.role = b.dataset.team; lsSet("la-role", ui.role); ui.vote={sel:[],done:false};
      const cur = store.bids[ui.role];
      if (!cur) write("bids/"+ui.role, {round:-1, amount:0, at:Date.now(), joined:true});
      else if (!cur.joined) write("bids/"+ui.role, Object.assign({}, cur, {joined:true}));
      setPresence(); wake(); break;
    }
    case "host-ask": ui.hostAsk = true; break;
    case "host-cancel": ui.hostAsk = false; break;
    case "be-host":
      ui.role = "host"; lsSet("la-role","host"); ui.hostAsk=false;
      if (store.mode==="live" && store.gotState && !store.state) write("game/state", freshState(DEFAULTS));
      setPresence(); wake(); break;
    case "create": write("game/state", freshState(DEFAULTS)); break;
    case "backup": ui.backupOpen = !ui.backupOpen; break;
    case "switch": ui.role = null; lsSet("la-role", null); ui.drawer=null; ui.confirm=null;
      if (store.room) { try { store.room.presence({role:null}).catch(() => {}); } catch(_){} } break;
    case "practice": store.mode = "practice"; store.state = freshState(DEFAULTS); store.gotState = true; store.error = ""; break;
    case "scoring": ui.drawer = ui.drawer==="scoring" ? null : "scoring"; break;
    case "start-round": openLot(nextLotId()); break;
    case "clear-error": store.error = ""; break;
    case "phase": setPhase(b.dataset.phase); break;
    case "next-lot": openLot(nextLotId()); break;
    case "open-lot": openLot(b.dataset.card); break;
    case "lots": ui.drawer = ui.drawer==="lots" ? null : "lots"; break;
    case "cancel": ui.drawer=null; ui.confirm=null; break;
    case "ask-reset": ui.confirm = "reset"; break;
    case "reset": resetGame(); break;
    case "sound": ui.sound = !ui.sound; lsSet("la-sound", ui.sound?"on":"off"); break;
    case "call": callOut(Number(b.dataset.n)); break;
    case "sell": sell(); break;
    case "nosale": noSale(); break;
    case "undo": undoSale(); break;
    case "bid-for": placeBid(b.dataset.team, S().settings.step); break;
    case "pitch": hostWrite(st => { st.pitchAt = Date.now(); }); break;
    case "revote": hostWrite(st => { st.voteRound = (st.voteRound||1)+1; }); break;
    case "bid": if (team) placeBid(team, Number(b.dataset.jump)); break;
    case "want": if (team) { const p = plan(team); const id=b.dataset.card; p[id] = Object.assign({}, p[id], {want: !(p[id]&&p[id].want)}); savePlan(team,p); } break;
    case "pick-vote": {
      const id = b.dataset.card; const need = Math.min(3, voteCandidates().length);
      const i = ui.vote.sel.indexOf(id);
      if (i>=0) ui.vote.sel.splice(i,1); else if (ui.vote.sel.length<need) ui.vote.sel.push(id);
      break;
    }
    case "cast": if (team) castVote(team); break;
    case "next-voter": ui.vote = {sel:[], done:false}; break;
  }
  scheduleRender();
});
$app.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.set) {
    const key = el.dataset.set;
    hostWrite(st => {
      if (key==="team") { const name = el.value.trim(); if (name) st.settings.teams[Number(el.dataset.i)] = name; }
      else { const n = Math.round(Number(el.value)); if (n>0) st.settings[key] = n; }
    });
  } else if (el.dataset.plan && ui.role && ui.role!=="host") {
    const p = plan(ui.role); const id = el.dataset.plan; const n = Math.max(0, Math.round(Number(el.value)||0));
    p[id] = Object.assign({}, p[id], {max:n, want: n>0 ? true : !!(p[id]&&p[id].want)}); savePlan(ui.role, p);
  }
});

/* keep tablets and the projector awake */
let lock = null;
async function wake(){ try { if (navigator.wakeLock && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => { lock=null; }); } } catch(e){} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState==="visible" && ui.role) wake(); });

// a tablet whose game was reset starts a fresh vote screen
let lastVoteRound = null;
const _render = render;
render = function(){ const vr = S().voteRound; if (lastVoteRound!==null && vr!==lastVoteRound) ui.vote={sel:[],done:false}; lastVoteRound = vr; _render(); };

init();
})();
</script>
